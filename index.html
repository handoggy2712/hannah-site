<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hannah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hannah">
  <meta name="theme-color" content="#FAF4E8">
  <link rel="stylesheet" href="style.css">
  <style>
    .site-nav { display: none; }
    body { padding-top: env(safe-area-inset-top, 0px); }

    /* ---- Header ---- */
    .home-header {
      padding: 52px 24px 20px;
      max-width: 480px;
      margin: 0 auto;
      animation: fadeUp 0.6s ease both;
    }

    .greeting-name {
      font-family: 'Abril Fatface', serif;
      font-weight: 400;
      font-size: 84px;
      color: var(--accent-warm);
      letter-spacing: -2px;
      line-height: 0.9;
      margin-bottom: 14px;
    }

    .home-date {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 400;
      color: var(--subtitle);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .home-divider {
      height: 1px;
      background: var(--divider);
      margin: 20px 0 0;
    }

    /* ---- Countdown ---- */
    .countdown-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 24px 0;
      animation: fadeUp 0.6s ease 0.08s both;
    }

    .countdown-card {
      background: var(--accent-warm);
      border-radius: 20px;
      padding: 20px 24px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
      display: block;
    }
    .countdown-card:active { transform: scale(0.97); }

    .countdown-label {
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }

    .countdown-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .countdown-number {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 56px;
      color: #fff;
      letter-spacing: -3px;
      line-height: 1;
    }

    .countdown-unit {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 18px;
      color: rgba(255,255,255,0.85);
      letter-spacing: -0.3px;
    }

    /* ---- Pages section ---- */
    .sections-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 24px 60px;
      animation: fadeUp 0.6s ease 0.14s both;
    }

    .sections-label {
      font-family: var(--font-heading);
      font-size: 10px;
      font-weight: 600;
      color: var(--subtitle);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 14px;
    }

    .sections-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ---- Tile (horizontal) ---- */
    .section-tile {
      border-radius: 18px;
      padding: 16px 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .section-tile:active { transform: scale(0.97); }
    .section-tile.coming-soon {
      opacity: 0.45;
      pointer-events: none;
    }

    .tile-icon-wrap {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tile-content { flex: 1; min-width: 0; }

    .tile-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
      color: var(--title);
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }

    .tile-desc {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 300;
      color: var(--body);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-chevron {
      font-size: 22px;
      font-weight: 300;
      color: var(--subtitle);
      flex-shrink: 0;
      line-height: 1;
    }

    /* ---- Footer ---- */
    .home-footer {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 24px 48px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 400;
      color: var(--divider);
      text-align: center;
    }
  </style>
</head>
<body>

<nav class="site-nav"></nav>

<!-- Header -->
<div class="home-header">
  <div class="greeting-name">Hannah.</div>
  <div class="home-date" id="home-date"></div>
  <div class="home-divider"></div>
</div>

<!-- Countdown -->
<div class="countdown-wrap">
  <a class="countdown-card" href="holidays.html">
    <div class="countdown-label">European summer 2026</div>
    <div class="countdown-main">
      <span class="countdown-number" id="countdown-number">—</span>
      <span class="countdown-unit" id="countdown-unit"></span>
    </div>
  </a>
</div>

<!-- Pages -->
<div class="sections-wrap">
  <div class="sections-label">My pages</div>
  <div class="sections-list">

    <a class="section-tile" href="holidays.html" style="background:#5A96E0;">
      <div class="tile-icon-wrap">
        <!-- suitcase sketchy -->
        <svg width="42" height="42" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 18 Q6.5 13 11 13 L37 13 Q42 13 41.5 18 L41.5 37 Q42 42 37 42 L11 42 Q6.5 42 7 37 Z" fill="#E86448" fill-opacity="0.2" stroke="#E86448" stroke-width="3" stroke-linejoin="round"/>
          <path d="M17.5 13 L17 9.5 Q17 7 20 7 L28 7 Q31 7 31 9.5 L30.5 13" stroke="#E86448" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 26.5 Q18 28 24 27.5 Q33 27 41.5 26.5" stroke="#E86448" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M24 13 Q24.5 27.5 24 42" stroke="#E86448" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="12.5" cy="42" r="3" fill="#E86448"/>
          <circle cx="35.5" cy="42" r="3" fill="#E86448"/>
        </svg>
      </div>
      <div class="tile-content">
        <div class="tile-title">Holidays</div>
        <div class="tile-desc">Travel plans &amp; itineraries</div>
      </div>
      <div class="tile-chevron">›</div>
    </a>

  </div>
</div>

<div class="home-footer">Hannah · built with love</div>

<script>
  const now = new Date();

  document.getElementById('home-date').textContent = now.toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  }).toUpperCase();

  const depart = new Date('2026-06-14');
  const days = Math.ceil((depart - now) / 86400000);
  const numEl = document.getElementById('countdown-number');
  const unitEl = document.getElementById('countdown-unit');

  if (days > 0) {
    const weeks = Math.floor(days / 7);
    const remainder = days % 7;
    if (weeks > 0 && remainder > 0) {
      numEl.textContent = weeks;
      unitEl.textContent = `week${weeks !== 1 ? 's' : ''} and ${remainder} day${remainder !== 1 ? 's' : ''} to go`;
    } else if (weeks > 0) {
      numEl.textContent = weeks;
      unitEl.textContent = `week${weeks !== 1 ? 's' : ''} to go`;
    } else {
      numEl.textContent = days;
      unitEl.textContent = `day${days !== 1 ? 's' : ''} to go`;
    }
  } else if (days === 0) {
    numEl.textContent = '✈️';
    unitEl.textContent = 'Today\'s the day!';
  } else {
    numEl.textContent = '☀️';
    unitEl.textContent = 'Currently on holiday!';
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>

</body>
</html>
