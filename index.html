<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hannah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hannah">
  <meta name="theme-color" content="#FDFCFA">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Home page hides the nav bar — it IS the home */
    .site-nav { display: none; }
    body { padding-top: env(safe-area-inset-top, 24px); }

    .home-header {
      padding: 40px 24px 28px;
      max-width: 480px;
      margin: 0 auto;
      animation: fadeUp 0.7s ease both;
    }

    .greeting {
      font-family: var(--font-heading);
      font-weight: 300;
      font-size: 28px;
      color: var(--title);
      letter-spacing: -0.4px;
      line-height: 1.3;
    }
    .greeting-name { font-weight: 500; }

    .home-date {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 300;
      color: var(--subtitle);
      margin-top: 6px;
      letter-spacing: 0.1px;
    }

    .home-divider {
      height: 1px;
      background: var(--divider);
      margin: 22px 0 0;
    }

    /* ---- Section grid ---- */
    .sections-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .sections-label {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 400;
      color: var(--subtitle);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      margin-bottom: 16px;
    }

    .sections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .section-tile {
      background: #fff;
      border: 1px solid var(--divider);
      border-radius: 18px;
      padding: 20px 18px 18px;
      text-decoration: none;
      display: block;
      animation: fadeUp 0.6s ease both;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .section-tile:active {
      transform: scale(0.96);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .section-tile.coming-soon {
      opacity: 0.45;
      pointer-events: none;
    }

    .tile-icon {
      font-size: 30px;
      line-height: 1;
      margin-bottom: 14px;
      display: block;
    }

    .tile-title {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 500;
      color: var(--title);
      letter-spacing: -0.2px;
      margin-bottom: 4px;
    }

    .tile-desc {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 300;
      color: var(--subtitle);
      line-height: 1.55;
    }

    .tile-action {
      display: inline-block;
      margin-top: 12px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 400;
    }

    .tile-action.open { color: var(--accent-warm); }

    .tile-action.soon {
      color: var(--subtitle);
      background: var(--callout-bg);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ---- Countdown ---- */
    .countdown-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 24px 4px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .countdown-card {
      background: linear-gradient(135deg, #FFF8F0, #FFF2E4);
      border: 1px solid #F0DCC8;
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    .countdown-card:active { transform: scale(0.97); }

    .countdown-number {
      font-family: var(--font-heading);
      font-size: 48px;
      font-weight: 500;
      color: var(--accent-warm);
      letter-spacing: -2px;
      line-height: 1;
      flex-shrink: 0;
    }

    .countdown-info { flex: 1; }

    .countdown-title {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 500;
      color: var(--title);
      letter-spacing: -0.2px;
      margin-bottom: 3px;
    }

    .countdown-sub {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 300;
      color: var(--subtitle);
    }

    /* Home footer */
    .home-footer {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 300;
      color: var(--divider);
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Site nav hidden on home — kept in DOM for consistency -->
<nav class="site-nav"></nav>

<!-- Header -->
<div class="home-header">
  <div class="greeting">Hello, <span class="greeting-name">Hannah</span>.</div>
  <div class="home-date" id="home-date"></div>
  <div class="home-divider"></div>
</div>

<!-- Countdown -->
<div class="countdown-wrap">
  <a class="countdown-card" href="holidays.html">
    <div class="countdown-number" id="countdown-days">—</div>
    <div class="countdown-info">
      <div class="countdown-title">European summer 2026</div>
      <div class="countdown-sub" id="countdown-sub">departing 14 June</div>
    </div>
  </a>
</div>

<!-- Section tiles -->
<div class="sections-wrap">
  <div class="sections-label">My pages</div>
  <div class="sections-grid">

    <a class="section-tile" href="holidays.html" style="animation-delay:0.05s">
      <span class="tile-icon">✈️</span>
      <div class="tile-title">Holidays</div>
      <div class="tile-desc">Travel plans &amp; itineraries</div>
      <div class="tile-action open">Open →</div>
    </a>

    <div class="section-tile coming-soon" style="animation-delay:0.1s">
      <span class="tile-icon">📋</span>
      <div class="tile-title">Lists</div>
      <div class="tile-desc">Shopping, packing &amp; to-dos</div>
      <div class="tile-action soon">Coming soon</div>
    </div>

    <a class="section-tile" href="notes.html" style="animation-delay:0.15s">
      <span class="tile-icon">📝</span>
      <div class="tile-title">Notes</div>
      <div class="tile-desc">Things to remember</div>
      <div class="tile-action open">Open →</div>
    </a>

    <div class="section-tile coming-soon" style="animation-delay:0.2s">
      <span class="tile-icon">🍝</span>
      <div class="tile-title">Recipes</div>
      <div class="tile-desc">Saved favourites</div>
      <div class="tile-action soon">Coming soon</div>
    </div>

  </div>
</div>

<div class="home-footer">Hannah · built with love</div>

<script>
  const now = new Date();

  // Date
  document.getElementById('home-date').textContent = now.toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  // Countdown
  const depart = new Date('2026-06-14');
  const days = Math.ceil((depart - now) / 86400000);
  const daysEl = document.getElementById('countdown-days');
  const subEl = document.getElementById('countdown-sub');
  if (days > 0) {
    daysEl.textContent = days;
    subEl.textContent = `day${days === 1 ? '' : 's'} to go · departing 14 June`;
  } else if (days === 0) {
    daysEl.textContent = '✈️';
    subEl.textContent = 'Today\'s the day — bon voyage!';
  } else {
    daysEl.textContent = '☀️';
    subEl.textContent = 'Currently on holiday!';
  }

  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>

</body>
</html>
